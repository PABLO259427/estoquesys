<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Obras - Pablo Leandro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
body{font-family:Inter,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh}
.glass{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2)}
.dark-glass{background:rgba(15,23,42,.88);backdrop-filter:blur(16px)}
.lay{display:grid;grid-template-columns:250px minmax(0,1fr)}
#nav{background:rgba(249,250,251,.85);border-right:1px solid #e5e7eb;padding:10px 0}
.tb{display:block;width:100%;text-align:left;padding:12px 18px;border-left:3px solid transparent;font-size:14px;color:#4b5563;font-weight:500;transition:.2s}
.tb i{width:20px;text-align:center;margin-right:8px}.tb:hover{color:#1f2937}
.tb.on{border-left-color:#667eea;background:rgba(102,126,234,.08);color:#667eea;font-weight:600}
.grp{padding:12px 18px 4px;font-size:11px;color:#9ca3af;font-weight:600}
.inp{width:100%;margin-top:4px;border:1px solid #e5e7eb;border-radius:8px;padding:8px 12px;font-size:14px;background:#fff;outline:none;color:#111827}
.inp:focus{box-shadow:0 0 0 2px #667eea}
.btn-p{padding:8px 16px;border-radius:8px;background:#4f46e5;color:#fff;font-size:14px;font-weight:500;transition:.2s}.btn-p:hover{background:#4338ca}
.btn-g{padding:8px 16px;border-radius:8px;background:#fff;border:1px solid #d1d5db;color:#374151;font-size:14px;font-weight:500}.btn-g:hover{background:#f9fafb}
@media(max-width:768px){.lay{grid-template-columns:1fr}#nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid #e5e7eb;padding:0}.tb{white-space:nowrap;width:auto;border-left:0;border-bottom:3px solid transparent}.tb.on{border-bottom-color:#667eea}.grp{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body class="p-4 md:p-8">
<div id="toast" class="fixed top-6 right-6 z-[100] flex flex-col gap-3"></div><div id="modal"></div>
<div class="max-w-7xl mx-auto">
<div class="glass relative z-20 rounded-2xl p-6 mb-6 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
<div class="flex items-center gap-4"><div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center text-white text-2xl shadow-lg"><i class="fas fa-helmet-safety"></i></div>
<div><h1 class="text-2xl font-bold text-gray-800">Pablo Leandro Martins Duarte</h1><p class="text-sm text-gray-600">Gestão de Obras</p></div></div>
<div class="flex gap-3 flex-wrap justify-center">
<div class="relative"><i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i><input id="gs" placeholder="Buscar (Ctrl+K)" autocomplete="off" oninput="srch(this.value)" onfocus="srch(this.value)" onblur="setTimeout(()=>$('#sd').classList.add('hidden'),150)" class="pl-9 pr-4 py-2 border border-gray-200 rounded-lg text-sm w-64 outline-none focus:ring-2 focus:ring-indigo-400 bg-white"><div id="sd" class="hidden absolute left-0 top-full mt-1 w-[360px] bg-white border border-gray-200 rounded-xl shadow-2xl z-[60] max-h-[380px] overflow-y-auto"></div></div>
<button onclick="repWord()" class="btn-p"><i class="fas fa-file-word mr-2"></i>Relatório</button>
<button onclick="repPDF()" class="btn-g"><i class="fas fa-file-pdf mr-2"></i>PDF</button>
<button onclick="bkp()" class="btn-g"><i class="fas fa-download mr-2"></i>Backup</button>
<button onclick="$('#imp').click()" class="btn-g"><i class="fas fa-upload mr-2"></i>Importar</button>
<input type="file" id="imp" class="hidden" accept=".json" onchange="imp(this)"></div></div>
<div class="glass lay rounded-2xl shadow-xl overflow-hidden min-h-[600px]"><nav id="nav"></nav><div id="content" class="min-w-0"></div></div>
</div>
<script>
const $=s=>document.querySelector(s),K='obras_pl_v2',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>new Date().toISOString().slice(0,10),money=v=>'R$ '+(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2}),fd=d=>d?d.split('-').reverse().join('/'):'-';
let S;try{S=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
S=S||{obra:{nome:'',ini:'',fim:'',orc:0,meses:12},et:[],mt:[],mv:[],di:[],rs:[],ep:[],cat:[]};['rq','fr','co','dc','ms','fo','pc','lt'].forEach(k=>S[k]=S[k]||[]);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let cur='dash',ch;
const NAV=[['dash','Dashboard','fa-chart-line','Visão geral'],['al','Alertas','fa-bell'],['an','Analytics','fa-chart-pie'],
['cr','Cronograma','fa-calendar-days','Planejamento'],['cs','Curva S','fa-chart-area'],['di','Diário','fa-book'],
['mt','Materiais','fa-boxes-stacked','Estoque'],['en','Entrada','fa-arrow-down'],['sa','Saída','fa-arrow-up'],['dv','Devolução','fa-rotate-left'],['es','Estoque','fa-warehouse'],['iv','Inventário','fa-clipboard-check'],['hi','Histórico','fa-clock-rotate-left'],['rq','Requisições','fa-clipboard-list'],['kx','Kardex','fa-table-list'],['sc','Compras','fa-cart-shopping'],['pc','Pedidos de compra','fa-file-invoice'],['fo','Fornecedores','fa-truck'],['lt','Lotes e validade','fa-hourglass-half'],['tr','Transferência','fa-right-left'],['ab','Curva ABC','fa-ranking-star'],['fr','Ferramentas','fa-screwdriver-wrench'],
['rs','Resíduos','fa-recycle','Segurança e ambiente'],['ep','Ficha EPI','fa-user-shield'],
['co','Consumo previsto','fa-scale-balanced','Edificações e engenharia'],['ms','Medições','fa-ruler-combined'],['dc','Documentos','fa-file-contract']];
function toast(m,t){const e=document.createElement('div');e.className='px-4 py-3 rounded-xl text-sm text-white shadow-xl border border-white/10 backdrop-blur '+(t?'bg-rose-600/90':'bg-slate-900/90');e.innerHTML=`<i class="fas ${t?'fa-circle-exclamation':'fa-circle-check'} mr-2"></i>${m}`;$('#toast').append(e);setTimeout(()=>e.remove(),3200)}
const days=d=>d?Math.ceil((new Date(d)-new Date(today()))/864e5):0;
const prog=()=>{const t=S.et.reduce((a,e)=>a+(+e.orc||1),0);return t?Math.round(S.et.reduce((a,e)=>a+(+e.orc||1)*e.prog,0)/t):0};
const esp=()=>{const{ini,fim}=S.obra;return ini&&fim?Math.max(0,Math.min(100,(new Date(today())-new Date(ini))/(new Date(fim)-new Date(ini))*100)):0};
const estVal=()=>S.mt.reduce((a,m)=>a+m.estoque*m.val,0);
function alertas(){const a=[];
S.mt.forEach(m=>{if(m.min&&m.estoque<=m.min)a.push(['w','fa-box-open',`${m.desc}: saldo ${m.estoque} ${m.un} (mínimo ${m.min})`])});
S.et.forEach(e=>{const d=days(e.fim);if(e.fim&&e.prog<100){if(d<0)a.push(['e','fa-clock',`Etapa "${e.nome}" atrasada ${-d} dia(s), ${e.prog}% concluída`]);else if(d<=7)a.push(['w','fa-hourglass-half',`Etapa "${e.nome}" vence em ${d} dia(s)`])}});
S.cat.forEach(c=>{const d=days(c.val);if(c.val){if(d<0)a.push(['e','fa-helmet-safety',`CA ${c.ca} (${c.nome}) vencido`]);else if(d<=30)a.push(['w','fa-helmet-safety',`CA ${c.ca} (${c.nome}) vence em ${d} dia(s)`])}});
S.lt.forEach(l=>{if(l.val&&l.qtd>0){const n=days(l.val);if(n<0)a.push(['e','fa-hourglass-end',`Lote ${l.lote} de ${mn(l.mat).desc} vencido`]);else if(n<=30)a.push(['w','fa-hourglass-half',`Lote ${l.lote} de ${mn(l.mat).desc} vence em ${n} dia(s)`])}});
S.pc.forEach(q=>{if(q.st=='Aberto'&&q.prazo&&days(q.prazo)<0)a.push(['w','fa-truck',`Pedido de ${mn(q.mat).desc} atrasado (${q.forn})`])});
const pq=S.rq.filter(q=>q.st=='Pendente').length;if(pq)a.push(['w','fa-clipboard-list',pq+' requisição(ões) aguardando aprovação']);
S.dc.forEach(d=>{const n=days(d.val);if(d.val){if(n<0)a.push(['e','fa-file-contract',`${d.doc} vencido`]);else if(n<=30)a.push(['w','fa-file-contract',`${d.doc} vence em ${n} dia(s)`])}});
S.fr.forEach(f=>{if(!f.dev&&days(f.dt)<-7)a.push(['w','fa-screwdriver-wrench',`${f.ferr} com ${f.quem} há ${-days(f.dt)} dias`])});return a}
/* formulários */
const inpH=(f,v)=>{const[k,l,t,o]=f;let c;
if(t=='select')c=`<select id="f_${k}" class="inp" ${f[5]||''}>${(typeof o=='function'?o():o).map(x=>{x=Array.isArray(x)?x:[x,x];return`<option value="${x[0]}" ${x[0]==v?'selected':''}>${x[1]}</option>`}).join('')}</select>`;
else if(t=='textarea')c=`<textarea id="f_${k}" rows="3" class="inp">${v??''}</textarea>`;
else c=`<input id="f_${k}" type="${t}" step="any" value="${v??''}" class="inp">`;
return`<label class="block text-xs font-medium text-gray-600 ${t=='textarea'?'md:col-span-2':''}">${l}${c}</label>`};
const grid=(fs,d={})=>`<div class="grid md:grid-cols-2 gap-3">${fs.map(f=>inpH(f,d[f[0]]??f[4])).join('')}</div>`;
const rd=fs=>Object.fromEntries(fs.map(f=>{const v=$('#f_'+f[0]).value;return[f[0],f[2]=='number'?+v||0:v]}));
const closeM=()=>$('#modal').innerHTML='';
function modal(t,fs,cb,d={},extra='',after){$('#modal').innerHTML=`<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4"><div class="glass rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6"><h3 class="text-lg font-bold text-gray-800 mb-4">${t}</h3>${grid(fs,d)}${extra}<div class="flex justify-end gap-2 mt-5"><button class="btn-g" onclick="closeM()">Cancelar</button><button id="mok" class="btn-p">Salvar</button></div></div></div>`;
$('#mok').onclick=()=>{if(cb(rd(fs))!==false)closeM()};after&&after()}
function edit(key,fs,t,id){const d=id?S[key].find(x=>x.id==id):{};
modal((id?'Editar ':'Nova ')+t,fs,v=>{if(!v[fs[0][0]])return toast('Preencha: '+fs[0][1],1)||false;
if(id)Object.assign(d,v);else S[key].push({id:uid(),dt:today(),...v});save();go(cur)},d)}
function del(key,id){if(!confirm('Excluir este registro?'))return;S[key]=S[key].filter(x=>x.id!=id);save();go(cur)}
/* componentes */
const tbl=(h,r)=>r.length?`<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-gray-500 border-b border-gray-200">${h.map(x=>`<th class="py-2 pr-3 font-medium">${x}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr class="border-b border-gray-100 hover:bg-indigo-50/40">${x.map(c=>`<td class="py-2 pr-3">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<p class="text-sm text-gray-400 py-8 text-center">Nenhum registro ainda.</p>`;
const head=(t,b='')=>`<div class="flex items-center justify-between mb-5 gap-3 flex-wrap"><h2 class="text-xl font-bold text-gray-800">${t}</h2><div class="flex gap-2">${b}</div></div>`;
const addB=(fn,l)=>`<button onclick="${fn}" class="btn-p"><i class="fas fa-plus mr-2"></i>${l}</button>`;
const acts=(k,f,id,t)=>`<button onclick="edit('${k}',${f},'${t}','${id}')" class="text-indigo-600 mr-3" title="Editar"><i class="fas fa-pen"></i></button><button onclick="del('${k}','${id}')" class="text-rose-500" title="Excluir"><i class="fas fa-trash"></i></button>`;
const kpi=(l,v,s,c)=>`<div class="bg-gray-50 rounded-xl p-4 border border-gray-200"><p class="text-xs text-gray-500">${l}</p><h3 class="text-2xl font-semibold ${c||'text-gray-800'}">${v}</h3><p class="text-xs text-gray-400">${s||''}</p></div>`;
const bar=p=>`<div class="h-2 bg-gray-200 rounded-full min-w-[80px]"><div class="h-2 rounded-full bg-gradient-to-r from-blue-500 to-emerald-500" style="width:${p}%"></div></div>`;
const chart=(id,cfg)=>{ch&&ch.destroy();ch=new Chart($('#'+id),cfg)};
const etapaOpts=()=>[['','—'],...S.et.map(e=>e.nome)],matOpts=()=>S.mt.length?S.mt.map(m=>[m.id,`${m.cod} · ${m.desc} (${m.estoque} ${m.un})`]):[['','Cadastre um material'] ];
const FE=[['nome','Nome da etapa','text'],['ini','Data início','date'],['fim','Data fim','date'],['resp','Responsável','text'],['orc','Orçamento (R$)','number'],['prog','Progresso (%)','number',0,0]];
const FM=[['cod','Código','text'],['desc','Descrição','text'],['un','Unidade','select',['KG','M','M2','M3','PÇ','CX','SACO','TON']],['estoque','Estoque','number'],['min','Estoque mínimo','number'],['val','Valor unit. (R$)','number'],['perda','Perda prevista (%)','number'],['etapa','Etapa vinculada','select',etapaOpts],['loc','Localização (corredor/prateleira)','text']];
const FD=[['dt','Data','date',0,today()],['clima','Clima','select',['Sol','Nublado','Chuva']],['efetivo','Efetivo (pessoas)','number'],['atv','Atividades realizadas','textarea'],['oco','Ocorrências','textarea']];
const FR=[['mtr','Nº MTR','text'],['peso','Peso (KG)','number'],['classe','Classe','select',['II B (Inerte)','II A (Não Inerte)','I (Perigoso)']],['origem','Origem/Obra','text'],['dest','Destinação','select',['Aterro','Reciclagem','Reuso','Empresa Especializada']],['obs','Observações','textarea']];
const FC=[['nome','Nome do EPI','text'],['ca','CA padrão','text'],['fab','Fabricante','text'],['val','Validade do CA','date'],['per','Periodicidade','select',['3 meses','6 meses','12 meses','24 meses']],['estoque','Estoque atual','number']];
/* telas */
const R={},P={};
R.dash=()=>{const o=S.obra,p=prog(),late=p<esp()-10,A=alertas();
const k=(l,v,s,c,fn)=>`<div ${fn?`onclick="${fn}"`:''} class="bg-slate-800/50 rounded-xl p-4 border border-slate-700/50 ${fn?'cursor-pointer hover:border-indigo-400/60':''} transition"><p class="text-xs text-slate-400 mb-1">${l}</p><h3 class="text-3xl font-light ${c}">${v}</h3><p class="text-xs text-slate-500 mt-1">${s}</p></div>`;
const mv=[...S.mv].reverse().slice(0,6);
return`<div class="p-6"><div class="flex items-center justify-between mb-6 flex-wrap gap-2"><h2 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400"><i class="fas fa-helmet-safety mr-2 text-blue-400"></i>${o.nome||'Painel da obra'}</h2><span class="flex items-center gap-1 text-xs bg-slate-800 border border-slate-700 px-2 py-1 rounded-full text-slate-300"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>Dados salvos neste navegador</span></div>
<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">${k('Progresso geral',p+'%',late?'Atrasado':'No prazo',late?'text-rose-400':'text-emerald-400')}${k('Dias restantes',Math.max(0,days(o.fim)),'até a entrega','text-blue-300')}${k('Valor em estoque',money(estVal()),S.mt.length+' itens','text-amber-400')}${k('Alertas ativos',A.length,'Ver alertas',A.length?'text-rose-400':'text-emerald-400',"go('al')")}</div>
<div class="grid lg:grid-cols-2 gap-4"><div class="bg-slate-800/40 rounded-xl p-4 border border-slate-700/50"><h3 class="font-semibold mb-3">Etapas da obra</h3>${S.et.length?S.et.map(e=>`<div class="mb-3"><div class="flex justify-between text-sm"><span>${e.nome}</span><span class="text-slate-400">${e.prog}%</span></div><div class="h-2 bg-slate-700 rounded-full mt-1"><div class="h-2 rounded-full bg-gradient-to-r from-blue-400 to-emerald-400" style="width:${e.prog}%"></div></div></div>`).join(''):'<p class="text-sm text-slate-500">Nenhuma etapa. Vá em Cronograma para adicionar.</p>'}</div>
<div class="bg-slate-800/40 rounded-xl p-4 border border-slate-700/50"><h3 class="font-semibold mb-3">Últimas movimentações</h3>${mv.length?mv.map(m=>`<div class="flex justify-between text-sm py-2 border-b border-slate-700/50"><span><i class="fas ${m.tipo=='Entrada'?'fa-arrow-down text-emerald-400':m.tipo=='Saída'?'fa-arrow-up text-amber-400':'fa-rotate-left text-sky-400'} mr-2"></i>${m.nome}</span><span class="text-slate-400">${m.qtd} ${m.un} · ${fd(m.dt.slice(0,10))}</span></div>`).join(''):'<p class="text-sm text-slate-500">Nenhuma movimentação.</p>'}</div></div></div>`};
R.al=()=>{const A=alertas(),c={e:'bg-rose-50 border-rose-200 text-rose-700',w:'bg-amber-50 border-amber-200 text-amber-700'};
return`<div class="p-6">${head('Central de alertas',`<button onclick="go('al')" class="btn-g"><i class="fas fa-rotate mr-2"></i>Atualizar</button>`)}${A.length?A.map(a=>`<div class="border rounded-xl p-4 mb-2 text-sm ${c[a[0]]}"><i class="fas ${a[1]} mr-3"></i>${a[2]}</div>`).join(''):'<p class="text-sm text-gray-400 py-8 text-center"><i class="fas fa-circle-check text-emerald-500 mr-2"></i>Tudo em ordem, nenhum alerta.</p>'}</div>`};
const setO=(k,v)=>{S.obra[k]=['nome','ini','fim'].includes(k)?v:+v;save();if(cur=='cs')go('cs')};
R.cr=()=>{const o=S.obra;return`<div class="p-6">${head('Cronograma físico',addB("edit('et',FE,'etapa')",'Nova etapa'))}
<div class="grid md:grid-cols-3 gap-3 mb-6"><label class="text-xs font-medium text-gray-600 md:col-span-3">Nome da obra<input class="inp" value="${o.nome}" onchange="setO('nome',this.value)"></label><label class="text-xs font-medium text-gray-600">Data início<input type="date" class="inp" value="${o.ini}" onchange="setO('ini',this.value)"></label><label class="text-xs font-medium text-gray-600">Data entrega<input type="date" class="inp" value="${o.fim}" onchange="setO('fim',this.value)"></label></div>
${tbl(['Etapa','Início','Fim','Responsável','Orçamento','Progresso',''],S.et.map(e=>[e.nome,fd(e.ini),fd(e.fim),e.resp||'-',money(e.orc),`<div class="flex items-center gap-2">${bar(e.prog)}<span class="text-xs">${e.prog}%</span></div>`,acts('et','FE',e.id,'etapa')]))}</div>`};
function csv(){const o=S.obra,n=o.meses||12,t=Math.min(1,Math.max(0,o.ini?(new Date(today())-new Date(o.ini))/(n*2592e6):0));return{n,t,pl:t*t*(3-2*t)*o.orc,re:S.et.reduce((a,e)=>a+e.orc*e.prog/100,0)}}
R.cs=()=>{const o=S.obra,c=csv(),d=c.re-c.pl;return`<div class="p-6">${head('Curva S: planejado x realizado')}
<div class="grid md:grid-cols-2 gap-3 mb-5"><label class="text-xs font-medium text-gray-600">Orçamento total (R$)<input type="number" class="inp" value="${o.orc}" onchange="setO('orc',this.value)"></label><label class="text-xs font-medium text-gray-600">Período (meses)<input type="number" class="inp" value="${o.meses}" onchange="setO('meses',this.value)"></label></div>
<div class="grid grid-cols-3 gap-3 mb-5">${kpi('Planejado',money(c.pl))}${kpi('Realizado',money(c.re))}${kpi('Desvio',money(d),o.orc?(d/o.orc*100).toFixed(1)+'% do orçamento':'',d<0?'text-rose-600':'text-emerald-600')}</div><canvas id="cv" height="110"></canvas></div>`};
P.cs=()=>{const o=S.obra,n=o.meses||12,lb=[],pl=[];for(let i=0;i<=n;i++){const t=i/n;lb.push('Mês '+i);pl.push(+(t*t*(3-2*t)*o.orc).toFixed(2))}
const c=csv(),i=Math.round(c.t*n);chart('cv',{type:'line',data:{labels:lb,datasets:[{label:'Planejado',data:pl,borderColor:'#667eea',backgroundColor:'rgba(102,126,234,.12)',fill:true,tension:.4},{label:'Realizado',data:lb.map((_,k)=>k==i?c.re:null),borderColor:'#10b981',backgroundColor:'#10b981',pointRadius:7}]}})};
R.di=()=>`<div class="p-6">${head('Diário de obra',addB("edit('di',FD,'registro')",'Novo registro'))}${S.di.length?[...S.di].sort((a,b)=>b.dt.localeCompare(a.dt)).map(d=>`<div class="border border-gray-200 rounded-xl p-4 mb-3"><div class="flex justify-between"><b class="text-gray-800">${fd(d.dt)}</b><span class="text-xs text-gray-500">${d.clima} · ${d.efetivo} pessoas ${acts('di','FD',d.id,'registro')}</span></div><p class="text-sm text-gray-700 mt-2 whitespace-pre-line">${d.atv||''}</p>${d.oco?`<p class="text-sm text-amber-700 mt-2"><i class="fas fa-triangle-exclamation mr-1"></i>${d.oco}</p>`:''}</div>`).join(''):tbl([],[])}</div>`;

const epSel=(a,v,fn,all)=>`<select class="inp !mt-0 max-w-[230px]" onchange="${fn}(this.value)">${[['',all],...[...new Set(a)].sort()].map(x=>{x=Array.isArray(x)?x:[x,x];return`<option value="${x[0]}" ${x[0]==v?'selected':''}>${x[1]}</option>`}).join('')}</select>`;
const setEpC=v=>{epC=v;go('ep')},setEpE=v=>{epE=v;go('ep')};
function prHist(){const l=S.ep.filter(f=>f.nome==epC),w=open('','_blank');w.document.write(`<body style="font-family:Arial;margin:1.5cm"><h2>Histórico de entrega de EPI</h2><p><b>Colaborador:</b> ${epC}${l[0]&&l[0].cpf?', CPF '+l[0].cpf:''}</p>${rt(['Data','EPI','CA','Qtd','Motivo','Próx. troca','Assinatura'],l.map(f=>[fd(f.dt),f.epi,f.ca,f.qtd,f.motivo,fd(f.prox),`<img src="${f.sig}" style="height:40px">`]))}<script>print()<\/script>`)}
/* almoxarifado: requisições */
const mn=id=>S.mt.find(m=>m.id==id)||{desc:'(removido)',un:'',estoque:0,val:0};
const FQ=[['solic','Solicitante','text'],['etapa','Etapa','select',etapaOpts],['mat','Material','select',matOpts],['qtd','Quantidade','number'],['obs','Observações','textarea']];
const stC={Pendente:'text-amber-600',Aprovada:'text-blue-600',Atendida:'text-emerald-600',Recusada:'text-rose-600'};
R.rq=()=>`<div class="p-6">${head('Requisições de material',addB('reqN()','Nova requisição'))}${tbl(['Data','Solicitante','Material','Qtd','Etapa','Status',''],S.rq.map(q=>{const m=mn(q.mat);return[fd(q.dt),q.solic,m.desc,q.qtd+' '+m.un,q.etapa||'-',`<b class="${stC[q.st]}">${q.st}</b>`,q.st=='Pendente'?`<button class="text-emerald-600 mr-3" onclick="rqSt('${q.id}','Aprovada')">Aprovar</button><button class="text-rose-500" onclick="rqSt('${q.id}','Recusada')">Recusar</button>`:q.st=='Aprovada'?`<button class="btn-p !py-1" onclick="rqAt('${q.id}')">Atender</button>`:'']}))}</div>`;
function reqN(){modal('Nova requisição',FQ,v=>{if(!v.solic||!v.mat||v.qtd<=0)return toast('Informe solicitante, material e quantidade',1)||false;S.rq.push({id:uid(),dt:today(),st:'Pendente',...v});save();go('rq')})}
const rqSt=(id,s)=>{S.rq.find(q=>q.id==id).st=s;save();go('rq')};
function rqAt(id){const q=S.rq.find(x=>x.id==id),m=mn(q.mat);if(q.qtd>m.estoque)return toast(`Saldo insuficiente: ${m.estoque} ${m.un}`,1);m.estoque-=q.qtd;fefo(q.mat,q.qtd);S.mv.push({id:uid(),dt:new Date().toISOString(),tipo:'Saída',mat:q.mat,nome:m.desc,un:m.un,qtd:q.qtd,dest:'Requisição: '+q.solic,etapa:q.etapa,sub:'Expedido',val:m.val});q.st='Atendida';save();toast('Requisição atendida e baixa registrada');go('rq')}
/* kardex */
let kxM='';
const dl=m=>(m.tipo=='Saída'||m.tipo=='Transferência')?-m.qtd:m.tipo=='Ajuste'?+m.sub:(m.tipo=='Devolução'&&m.sub=='Perda Total')?0:m.qtd;
R.kx=()=>{const m=S.mt.find(x=>x.id==kxM)||S.mt[0],l=m?S.mv.filter(x=>x.mat==m.id):[];let s=m?m.estoque-l.reduce((a,x)=>a+dl(x),0):0;
return`<div class="p-6">${head('Kardex (ficha de estoque)')}<select class="inp max-w-md mb-4" onchange="kxM=this.value;go('kx')">${S.mt.map(x=>`<option value="${x.id}" ${m&&x.id==m.id?'selected':''}>${x.cod} · ${x.desc}</option>`).join('')}</select>${m?tbl(['Data','Tipo','Origem/Destino','Entrada','Saída','Saldo'],[['-','Saldo inicial','-','','',s],...l.map(x=>{const d=dl(x);s+=d;return[fd(x.dt.slice(0,10)),x.tipo,x.dest||'-',d>0?d:'',d<0?-d:'',s]})]):tbl([],[])}</div>`};
/* sugestão de compra */
R.sc=()=>{const l=S.mt.filter(m=>m.min&&m.estoque<=m.min).map(m=>({m,q:m.min*2-m.estoque}));return`<div class="p-6">${head('Sugestão de compra','<button class="btn-g" onclick="prSc()"><i class="fas fa-print mr-2"></i>Imprimir</button>')}<p class="text-sm text-gray-500 mb-4">Itens com saldo igual ou abaixo do mínimo. Quantidade sugerida: repor até o dobro do mínimo.</p>${tbl(['Material','Saldo','Mínimo','Comprar','Custo estimado'],l.map(({m,q})=>[m.desc,m.estoque+' '+m.un,m.min,`<b>${q} ${m.un}</b>`,money(q*m.val)]))}${l.length?`<p class="text-right font-semibold mt-3">Total estimado: ${money(l.reduce((a,x)=>a+x.q*x.m.val,0))}</p>`:''}</div>`};
const prSc=()=>{const t=$('#content table');if(!t)return toast('Nada a imprimir',1);const w=open('','_blank');w.document.write(`<body style="font-family:Arial;margin:1.5cm"><h2>Sugestão de compra</h2>${t.outerHTML}<script>print()<\/script>`)};
/* ferramentas */
const FF=[['ferr','Ferramenta/equipamento','text'],['cod','Patrimônio/código','text'],['quem','Colaborador','text']];
R.fr=()=>`<div class="p-6">${head('Cautela de ferramentas',addB("edit('fr',FF,'retirada')",'Nova retirada'))}${tbl(['Ferramenta','Código','Colaborador','Retirada','Devolução','Estado',''],S.fr.map(f=>[f.ferr,f.cod||'-',f.quem,fd(f.dt),f.dev?fd(f.dev):'<span class="text-amber-600">Em uso</span>',f.estado||'-',f.dev?'':`<button class="btn-p !py-1" onclick="frDv('${f.id}')">Devolver</button>`]))}</div>`;
function frDv(id){modal('Devolução de ferramenta',[['estado','Estado na devolução','select',['Bom','Danificada','Perdida']]],v=>{const f=S.fr.find(x=>x.id==id);f.dev=today();f.estado=v.estado;save();go('fr')})}
/* consumo previsto x real */
const FO=[['serv','Serviço (ex.: alvenaria)','text'],['etapa','Etapa','select',etapaOpts],['mat','Material','select',matOpts],['coef','Consumo por unidade do serviço','number'],['exec','Quantidade de serviço executada','number']];
R.co=()=>`<div class="p-6">${head('Consumo previsto x real',addB("edit('co',FO,'coeficiente')",'Novo coeficiente'))}<p class="text-sm text-gray-500 mb-4">Previsto = consumo por unidade × serviço executado. Real = saídas do material para a mesma etapa. Desvio acima de 10% fica em vermelho.</p>${tbl(['Serviço','Etapa','Material','Executado','Previsto','Real','Desvio',''],S.co.map(c=>{const m=mn(c.mat),pv=c.coef*c.exec,rl=S.mv.filter(x=>x.tipo=='Saída'&&x.mat==c.mat&&(x.etapa||'')==(c.etapa||'')).reduce((a,x)=>a+x.qtd,0),d=pv?(rl-pv)/pv*100:0;return[c.serv,c.etapa||'-',m.desc,c.exec,pv.toFixed(2)+' '+m.un,rl+' '+m.un,`<b class="${d>10?'text-rose-600':'text-emerald-600'}">${pv?(d>0?'+':'')+d.toFixed(1)+'%':'-'}</b>`,acts('co','FO',c.id,'coeficiente')]}))}</div>`;
/* medições */
const FS=[['etapa','Etapa','select',()=>S.et.map(e=>e.nome)],['prog','% acumulado executado','number'],['obs','Observações','textarea']];
function msN(){if(!S.et.length)return toast('Cadastre etapas no Cronograma primeiro',1);modal('Nova medição',FS,v=>{const e=S.et.find(x=>x.nome==v.etapa);if(v.prog<e.prog||v.prog>100)return toast(`O percentual deve ficar entre o atual (${e.prog}%) e 100%`,1)||false;S.ms.push({id:uid(),dt:today(),etapa:e.nome,de:e.prog,ate:v.prog,val:e.orc*(v.prog-e.prog)/100,obs:v.obs});e.prog=v.prog;save();toast('Medição registrada');go('ms')})}
R.ms=()=>`<div class="p-6">${head('Medições de serviço',addB('msN()','Nova medição'))}${tbl(['Data','Etapa','Avanço','Valor medido','Observações'],[...S.ms].reverse().map(m=>[fd(m.dt),m.etapa,m.de+'% → '+m.ate+'%',money(m.val),m.obs||'-']))}${S.ms.length?`<p class="text-right font-semibold mt-3">Total medido: ${money(S.ms.reduce((a,m)=>a+m.val,0))}</p>`:''}<p class="text-xs text-gray-400 mt-4">Cada medição atualiza o progresso da etapa, o Dashboard e a Curva S.</p></div>`;
/* documentos e licenças */
const FDC=[['doc','Documento (ART, alvará, licença)','text'],['num','Número','text'],['val','Validade','date'],['resp','Responsável','text']];
R.dc=()=>`<div class="p-6">${head('Documentos e licenças',addB("edit('dc',FDC,'documento')",'Novo documento'))}${tbl(['Documento','Número','Validade','Situação','Responsável',''],S.dc.map(d=>{const n=days(d.val);return[d.doc,d.num||'-',fd(d.val),d.val?`<b class="${n<0?'text-rose-600':n<=30?'text-amber-600':'text-emerald-600'}">${n<0?'Vencido':n<=30?'Vence em '+n+' dia(s)':'Válido'}</b>`:'-',d.resp||'-',acts('dc','FDC',d.id,'documento')]}))}</div>`;
/* almoxarifado avançado */
function fefo(id,q){S.lt.filter(l=>l.mat==id&&l.qtd>0).sort((a,b)=>(a.val||'9').localeCompare(b.val||'9')).forEach(l=>{const t=Math.min(l.qtd,q);l.qtd-=t;q-=t})}
/* fornecedores */
const FFo=[['nome','Fornecedor','text'],['cnpj','CNPJ','text'],['tel','Telefone','text'],['email','E-mail','text'],['obs','Observações','textarea']];
R.fo=()=>{const h=S.pc.filter(p=>p.vnf).sort((a,b)=>b.dtr.localeCompare(a.dtr));return`<div class="p-6">${head('Fornecedores',addB("edit('fo',FFo,'fornecedor')",'Novo fornecedor'))}${tbl(['Fornecedor','CNPJ','Telefone','E-mail',''],S.fo.map(f=>[f.nome,f.cnpj||'-',f.tel||'-',f.email||'-',acts('fo','FFo',f.id,'fornecedor')]))}<h3 class="font-semibold text-gray-800 mt-8 mb-2">Histórico de preços (notas fiscais recebidas)</h3>${tbl(['Data','Material','Fornecedor','Preço na NF','NF'],h.map(p=>[fd(p.dtr),mn(p.mat).desc,p.forn,money(p.vnf),p.nf]))}</div>`};
/* pedidos de compra com conferência de NF */
const FP=[['forn','Fornecedor','select',()=>S.fo.length?S.fo.map(f=>f.nome):[['','Cadastre um fornecedor']]],['mat','Material','select',matOpts],['qtd','Quantidade','number'],['val','Valor unit. previsto (R$)','number'],['prazo','Prazo de entrega','date']];
const FNF=[['nf','Nº da nota fiscal','text'],['qtd','Quantidade recebida (NF)','number'],['val','Valor unit. na NF (R$)','number'],['lote','Lote (opcional)','text'],['vl','Validade do lote','date']];
R.pc=()=>`<div class="p-6">${head('Pedidos de compra',addB('pcN()','Novo pedido'))}${tbl(['Data','Fornecedor','Material','Qtd','Valor unit.','Prazo','Status',''],[...S.pc].reverse().map(p=>{const m=mn(p.mat),c={Aberto:'text-blue-600',Recebido:'text-emerald-600',Divergente:'text-rose-600',Cancelado:'text-gray-400'}[p.st];return[fd(p.dt),p.forn,m.desc,p.qtd+' '+m.un,money(p.val),fd(p.prazo),`<b class="${c}">${p.st}</b>${p.dv?`<p class="text-xs text-rose-600">NF ${p.nf}: ${p.dv}</p>`:p.nf?`<p class="text-xs text-gray-500">NF ${p.nf}</p>`:''}`,p.st=='Aberto'?`<button class="btn-p !py-1 mr-2" onclick="pcRc('${p.id}')">Receber</button><button class="text-rose-500" onclick="pcSt('${p.id}')">Cancelar</button>`:'']}))}</div>`;
function pcN(){modal('Novo pedido de compra',FP,v=>{if(!v.forn||!v.mat||v.qtd<=0)return toast('Informe fornecedor, material e quantidade',1)||false;S.pc.push({id:uid(),dt:today(),st:'Aberto',...v});save();go('pc')})}
const pcSt=id=>{if(confirm('Cancelar este pedido?')){S.pc.find(p=>p.id==id).st='Cancelado';save();go('pc')}};
function pcRc(id){const p=S.pc.find(x=>x.id==id);modal('Conferência da nota fiscal',FNF,v=>{if(!v.nf||v.qtd<=0)return toast('Informe a NF e a quantidade recebida',1)||false;
const m=mn(p.mat),dv=[];if(v.qtd!=p.qtd)dv.push(`quantidade ${v.qtd} recebida x ${p.qtd} pedida`);if(Math.abs(v.val-p.val)>.005)dv.push(`preço ${money(v.val)} na NF x ${money(p.val)} no pedido`);
m.estoque+=v.qtd;if(v.val>0)m.val=v.val;S.mv.push({id:uid(),dt:new Date().toISOString(),tipo:'Entrada',mat:p.mat,nome:m.desc,un:m.un,qtd:v.qtd,dest:`${p.forn} (NF ${v.nf})`,etapa:m.etapa,sub:'Compra',val:m.val});
if(v.lote)S.lt.push({id:uid(),dt:today(),mat:p.mat,lote:v.lote,qtd:v.qtd,val:v.vl});
Object.assign(p,{st:dv.length?'Divergente':'Recebido',nf:v.nf,dv:dv.join('; '),vnf:v.val,dtr:today()});save();toast(dv.length?'Recebido com divergência na NF':'Recebimento conferido');go('pc')},{qtd:p.qtd,val:p.val},`<p class="text-xs text-gray-500 mt-3">Pedido: ${p.qtd} ${mn(p.mat).un} de ${mn(p.mat).desc} a ${money(p.val)}. Diferenças com a NF marcam o pedido como Divergente, e o estoque recebe a quantidade da NF.</p>`)}
/* lotes e validade */
const FL=[['mat','Material','select',matOpts],['lote','Lote','text'],['qtd','Quantidade','number'],['val','Validade','date']];
R.lt=()=>`<div class="p-6">${head('Lotes e validade',addB("edit('lt',FL,'lote')",'Novo lote'))}<p class="text-sm text-gray-500 mb-4">Ordenado pela validade mais próxima (o primeiro a vencer é o primeiro a sair). Saídas, transferências e requisições baixam os lotes nessa ordem.</p>${tbl(['Material','Lote','Saldo do lote','Validade','Situação',''],[...S.lt].sort((a,b)=>(a.val||'9').localeCompare(b.val||'9')).map(l=>{const n=days(l.val);return[mn(l.mat).desc,l.lote,l.qtd,fd(l.val),!l.val?'-':l.qtd<=0?'<span class="text-gray-400">Esgotado</span>':`<b class="${n<0?'text-rose-600':n<=30?'text-amber-600':'text-emerald-600'}">${n<0?'Vencido':n<=30?'Vence em '+n+' dia(s)':'Válido'}</b>`,acts('lt','FL',l.id,'lote')]}))}</div>`;
/* transferência entre obras */
MF['Transferência']=[['dest','Obra/depósito de destino','text'],['mat','Material','select',matOpts],['qtd','Quantidade','number'],['obs','Observações','textarea']];
R.tr=mvForm('Transferência','Transferência entre obras');
/* curva ABC */
let ABC=[];
R.ab=()=>{const a={};S.mv.filter(x=>x.tipo=='Saída').forEach(x=>a[x.mat]=(a[x.mat]||0)+x.qtd*x.val);const cons=Object.keys(a).length>0,src=cons?a:Object.fromEntries(S.mt.map(m=>[m.id,m.estoque*m.val])),l=Object.entries(src).map(([id,v])=>({m:mn(id),v})).filter(x=>x.v>0).sort((x,y)=>y.v-x.v),t=l.reduce((q,x)=>q+x.v,0);let c=0;
l.forEach(x=>{const ini=c/t*100;c+=x.v;x.c=c/t*100;x.k=ini<80?'A':ini<95?'B':'C'});ABC=l;const cl={A:'bg-rose-100 text-rose-700',B:'bg-amber-100 text-amber-700',C:'bg-emerald-100 text-emerald-700'};
return`<div class="p-6">${head('Curva ABC')}<p class="text-sm text-gray-500 mb-4">Base: ${cons?'valor consumido nas saídas':'valor em estoque (ainda não há saídas)'}. A = até 80% do valor, B = até 95%, C = o restante.</p>${l.length?'<canvas id="cb" height="90" class="mb-6"></canvas>':''}${tbl(['Classe','Material','Valor','% acumulado'],l.map(x=>[`<span class="px-2 py-1 rounded-full text-xs font-bold ${cl[x.k]}">${x.k}</span>`,x.m.desc,money(x.v),x.c.toFixed(1)+'%']))}</div>`};
P.ab=()=>{if(!ABC.length)return;chart('cb',{type:'bar',data:{labels:ABC.map(x=>x.m.desc),datasets:[{type:'bar',label:'Valor (R$)',data:ABC.map(x=>x.v),backgroundColor:'#667eea',borderRadius:4},{type:'line',label:'% acumulado',data:ABC.map(x=>+x.c.toFixed(1)),borderColor:'#10b981',yAxisID:'y1'}]},options:{scales:{y1:{position:'right',min:0,max:100,grid:{drawOnChartArea:false}}}}})};
go('dash');
</script></body></html>
